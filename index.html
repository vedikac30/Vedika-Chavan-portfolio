    function AudioPlayerSimulator() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [trackIndex, setTrackIndex] = useState(0);
      const [progress, setProgress] = useState(38);
      const [volume, setVolume] = useState(75);

      const playlist = [
        { title: "Midnight City Lights", artist: "Vedika's Synth Mix", duration: "3:42", genre: "Synthwave / Lo-Fi" },
        { title: "MERN Stack Groove", artist: "Fullstack Beats", duration: "2:54", genre: "Chillhop" },
        { title: "Async Pulse", artist: "Node.js Audio Lab", duration: "4:15", genre: "Ambient Electronic" }
      ];

      const currentTrack = playlist[trackIndex];

      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(() => {
            setProgress((prev) => (prev >= 100 ? 0 : prev + 1));
          }, 400);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      const handleNext = () => {
        setTrackIndex((prev) => (prev + 1) % playlist.length);
        setProgress(0);
      };

      const handlePrev = () => {
        setTrackIndex((prev) => (prev - 1 + playlist.length) % playlist.length);
        setProgress(0);
      };

      return (
        <div className="bg-slate-900 text-slate-100 rounded-2xl p-5 shadow-2xl border border-indigo-500/20 backdrop-blur-md">
          <div className="flex items-center justify-between pb-3 border-b border-slate-800">
            <div className="flex items-center space-x-2">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
              <span className="text-xs uppercase font-mono tracking-widest text-emerald-400">Live Player Simulation</span>
            </div>
            <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-medium">MERN Engine</span>
          </div>

          <div className="mt-4 flex items-center space-x-4">
            <div className="w-16 h-16 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-lg relative overflow-hidden group">
              <Sparkles className="w-8 h-8 text-white/80 animate-pulse" />
              <div className="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors"></div>
            </div>
            <div className="flex-1 min-w-0">
              <h4 className="text-base font-semibold truncate text-white">{currentTrack.title}</h4>
              <p className="text-xs text-slate-400 truncate">{currentTrack.artist} • <span className="text-indigo-400">{currentTrack.genre}</span></p>
              <div className="flex items-center space-x-2 text-[11px] text-slate-500 mt-1 font-mono">
                <span>0:{String(Math.floor((progress / 100) * 180)).padStart(2, '0')}</span>
                <span>/</span>
                <span>{currentTrack.duration}</span>
              </div>
            </div>
          </div>

          {/* Progress Bar */}
          <div className="mt-4 space-y-1">
            <div
              className="w-full bg-slate-800 h-2 rounded-full cursor-pointer relative overflow-hidden"
              onClick={(e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const newPerc = Math.max(0, Math.min(100, (clickX / rect.width) * 100));
                setProgress(Math.round(newPerc));
              }}
            >
              <div
                className="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full rounded-full transition-all duration-150"
                style={{ width: `${progress}%` }}
              />
            </div>
          </div>

          {/* Controls */}
          <div className="mt-4 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <button
                onClick={handlePrev}
                className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                title="Previous track"
              >
                <SkipBack className="w-4 h-4" />
              </button>
              <button
                onClick={() => setIsPlaying(!isPlaying)}
                className="p-3 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition-transform active:scale-95"
                title={isPlaying ? "Pause" : "Play"}
              >
                {isPlaying ? <Pause className="w-4 h-4 fill-white" /> : <Play className="w-4 h-4 fill-white ml-0.5" />}
              </button>
              <button
                onClick={handleNext}
                className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                title="Next track"
              >
                <SkipForward className="w-4 h-4" />
              </button>
            </div>

            {/* Volume */}
            <div className="flex items-center space-x-2">
              <Volume2 className="w-4 h-4 text-slate-400" />
              <input
                type="range"
                min="0"
                max="100"
                value={volume}
                onChange={(e) => setVolume(Number(e.target.value))}
                className="w-16 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
              />
              <span className="text-xs font-mono text-slate-400 w-6">{volume}%</span>
            </div>
          </div>
        </div>
      );
    }

    function CompressionSimulator() {
      const [selectedFormat, setSelectedFormat] = useState("Image (PNG/JPG)");
      const [compressionLevel, setCompressionLevel] = useState(65);
      const [isProcessing, setIsProcessing] = useState(false);

      const initialSizes = {
        "Image (PNG/JPG)": 4.8,
        "Video (MP4)": 45.2,
        "Audio (MP3)": 12.0,
        "Document (PDF)": 8.5
      };

      const originalSize = initialSizes[selectedFormat];
      // Calculate reduced size
      const savingsPercent = Math.round(compressionLevel * 0.85);
      const compressedSize = (originalSize * (1 - savingsPercent / 100)).toFixed(2);

      const triggerCompress = () => {
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
        }, 600);
      };

      return (
        <div className="bg-slate-900 text-slate-100 rounded-2xl p-5 shadow-2xl border border-indigo-500/20 backdrop-blur-md">
          <div className="flex items-center justify-between pb-3 border-b border-slate-800">
            <span className="text-xs uppercase font-mono tracking-widest text-emerald-400">Enhancio Android Engine</span>
            <span className="text-xs font-mono text-cyan-400">Kotlin Native Logic</span>
          </div>

          <div className="mt-4">
            <label className="text-xs text-slate-400 font-medium block mb-1">Target Media Format:</label>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {["Image (PNG/JPG)", "Video (MP4)", "Audio (MP3)", "Document (PDF)"].map((fmt) => (
                <button
                  key={fmt}
                  onClick={() => setSelectedFormat(fmt)}
                  className={`p-1.5 text-xs rounded-lg border text-center transition-all ${selectedFormat === fmt
                    ? "bg-indigo-600/30 border-indigo-500 text-indigo-200 font-semibold"
                    : "bg-slate-800 border-slate-700 text-slate-400 hover:text-white"
                    }`}
                >
                  {fmt.split(" ")[0]}
                </button>
              ))}
            </div>
          </div>

          <div className="mt-4">
            <div className="flex justify-between text-xs mb-1">
              <span className="text-slate-400">Compression Aggression:</span>
              <span className="text-indigo-400 font-mono font-bold">{compressionLevel}%</span>
            </div>
            <input
              type="range"
              min="20"
              max="90"
              value={compressionLevel}
              onChange={(e) => setCompressionLevel(Number(e.target.value))}
              className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
            />
          </div>

          <div className="mt-4 grid grid-cols-2 gap-3 p-3 bg-slate-800/60 rounded-xl border border-slate-700/60 text-center">
            <div>
              <p className="text-[11px] text-slate-400">Original File</p>
              <p className="text-base font-bold text-rose-400">{originalSize} MB</p>
            </div>
            <div>
              <p className="text-[11px] text-slate-400">Compressed Output</p>
              <p className="text-base font-bold text-emerald-400">
                {isProcessing ? "Optimizing..." : `${compressedSize} MB`}
              </p>
            </div>
          </div>

          <div className="mt-3 flex items-center justify-between">
            <span className="text-xs text-emerald-400 font-mono">
              Saved ~{savingsPercent}% disk space
            </span>
            <button
              onClick={triggerCompress}
              disabled={isProcessing}
              className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow transition-all active:scale-95 disabled:opacity-50"
            >
              {isProcessing ? "Processing..." : "Run Test Compression"}
            </button>
          </div>
        </div>
      );
    }
